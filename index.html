<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotina Divertida</title>
    <style>
        /* 1. VARIÁVEIS DE CORES */
        :root {
            --roxo-fundo: #1a0026;   /* Roxo escuro profundo */
            --roxo-brilho: #4a0072;  /* Roxo para o efeito blur */
            --cor-jogar: #4CAF50;    /* Verde para ação positiva */
            --cor-recompensa: #FFC107; /* Amarelo/Dourado */
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--roxo-fundo);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* 2. O FUNDO ROXO ESCURO COM BLUR */
        .fundo-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, var(--roxo-brilho), var(--roxo-fundo));
            filter: blur(40px); /* O blur suave que pediste */
            z-index: -1;
        }

        /* 3. O TELEMÓVEL */
        .mobile-frame {
            width: 100%;
            max-width: 768px;
            height: 100vh;
            background-color: #f4f6f9; /* Cor suave por dentro para não cansar a vista */
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            border: 8px solid #222;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 4. GESTÃO DOS ECRÃS */
        .ecra {
            display: none; /* Esconde todos os ecrãs por defeito */
            flex-direction: column;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .ativo {
            display: flex; /* Apenas o ecrã com a classe "ativo" aparece */
        }

        /* 5. DESIGN DO ECRÃ INICIAL */
        .ecra-inicio {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-jogar {
            background-color: var(--cor-jogar);
            color: white;
            font-size: 28px;
            font-weight: bold;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s;
        }

        .btn-jogar:hover { transform: scale(1.05); }

        /* 6. DESIGN DO ECRÃ DE NÍVEIS */
        .cabecalho-niveis {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .btn-recompensas {
            background-color: var(--cor-recompensa);
            color: #333;
            border: none;
            padding: 10px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .lista-niveis {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cartao-nivel {
            background: white;
            border: 2px solid #ddd;
            padding: 20px;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        /* Cores de feedback para as dificuldades */
        .cartao-nivel.facil { border-left: 8px solid #4CAF50; }
        .cartao-nivel.medio { border-left: 8px solid #FF9800; }
        .cartao-nivel.dificil { border-left: 8px solid #F44336; }
    </style>
</head>
<body>

    <div class="fundo-blur"></div>

    <div class="mobile-frame">

        <div id="ecra1" class="ecra ecra-inicio ativo">
            <h1 style="color: #333; margin-bottom: 50px;">A Minha Rotina</h1>
            <button class="btn-jogar" onclick="mudarEcra('ecra2')">▶ JOGAR</button>
        </div>

        <div id="ecra2" class="ecra">
            <div class="cabecalho-niveis">
                <h2 style="color: #333; margin: 0;">Dificuldade</h2>
                <button class="btn-recompensas" onclick="abrirRecompensas()">⭐ Recompensas</button>
            </div>

            <div class="lista-niveis">
                <button class="cartao-nivel facil">
                    <span style="font-size: 30px;">🟢</span>
                    <div>
                        <strong>Fácil</strong><br>
                        <span style="font-size: 14px; color: #666;">Muitas dicas visuais</span>
                    </div>
                </button>

                <button class="cartao-nivel medio">
                    <span style="font-size: 30px;">🟡</span>
                    <div>
                        <strong>Médio</strong><br>
                        <span style="font-size: 14px; color: #666;">Algumas dicas</span>
                    </div>
                </button>

                <button class="cartao-nivel dificil">
                    <span style="font-size: 30px;">🔴</span>
                    <div>
                        <strong>Difícil</strong><br>
                        <span style="font-size: 14px; color: #666;">Sem ajuda externa</span>
                    </div>
                </button>
            </div>
        </div>

    </div>

    <script>
        // Função para esconder o ecrã atual e mostrar o novo
        function mudarEcra(idNovoEcra) {
            // 1. Encontra todos os elementos com a classe 'ecra' e remove a classe 'ativo'
            let ecras = document.querySelectorAll('.ecra');
            ecras.forEach(function(ecra) {
                ecra.classList.remove('ativo');
            });

            // 2. Adiciona a classe 'ativo' apenas ao ecrã que queremos ver
            document.getElementById(idNovoEcra).classList.add('ativo');
        }

        // Função temporária para o botão de recompensas
        function abrirRecompensas() {
            alert("A tabela de recompensas vai abrir aqui!");
        }
    </script>
</body>
</html>
